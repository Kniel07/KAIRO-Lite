name: CI

# Document 7 §23 — "Every Pull Request must: Compile, Pass linting, Pass
# tests... No broken main branch." Document 13 §16-19 (Infrastructure
# Hardening Sprint) — previously nothing enforced this except a human (or
# an AI agent) remembering to run these commands locally, every time. This
# workflow is that enforcement.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: TypeScript, ESLint, Prettier, Prisma, Tests, Build
    runs-on: ubuntu-latest
    # Document 11 §9 — these are CI-only dummy values, never real secrets.
    # No live database is required for these particular steps:
    # `prisma validate`/`generate` only need a syntactically present
    # DATABASE_URL, and `next build` never queries the database (verified
    # locally with PostgreSQL stopped entirely — no page performs a Prisma
    # query at build time). The integration-test steps at the end of this
    # job override DATABASE_URL to point at the `postgres` service
    # container below instead (Document 13 §28, Amendment 26, Phase 7.5 —
    # Phase 7 QA Report finding Q1).
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-only-dummy-secret-not-a-real-credential"
      AUTH_URL: "http://localhost:3000"
      RESEND_API_KEY: "ci-only-dummy-key"
      KAIRO_OWNER_EMAIL: "ci@example.com"
      OPENAI_API_KEY: "ci-only-dummy-key"

    services:
      # Document 13 §28 (Amendment 26, Phase 7.5) — only the final two
      # steps (migrate + integration test) actually connect to this; every
      # earlier step keeps using the dummy DATABASE_URL above, unchanged.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kairo
          POSTGRES_PASSWORD: kairo
          POSTGRES_DB: kairo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Must run before typecheck/lint/build — `@/generated/prisma/client`
      # is gitignored (regenerated, not committed) and the app's own
      # types/imports depend on it existing.
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier (check only)
        run: npm run format:check

      - name: Prisma schema validation
        run: npx prisma validate

      - name: Unit tests
        run: npm test

      - name: Next.js production build
        run: npm run build

      # Document 13 §28 (Amendment 26, Phase 7.5) — Phase 7 QA Report
      # finding Q1: everything above validates schema *shape* but never
      # actually runs against Postgres, so a raw-SQL regression (like the
      # Phase 6 parameter-type-inference bug, Document 13 §27) would pass
      # every step above and only fail at runtime. These two steps are the
      # first thing in this pipeline that talks to a real database.
      - name: Apply migrations to live database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://kairo:kairo@localhost:5432/kairo_ci"

      - name: Integration tests (live database)
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://kairo:kairo@localhost:5432/kairo_ci"
